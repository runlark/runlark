[graph]
all-features = true
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "all"

[licenses]
allow = ["0BSD", "Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
