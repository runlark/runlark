[workspace]
resolver = "3"
members = [
  "crates/runlark-domain",
  "crates/runlark-local",
  "crates/runlark-wasm",
  "crates/runlark-cli",
  "crates/runlark-server",
]

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
authors = ["Runlark Authors"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "deny"

[workspace.dependencies]
runlark-domain = { path = "crates/runlark-domain", version = "0.1.0" }
runlark-local = { path = "crates/runlark-local", version = "0.1.0" }
runlark-wasm = { path = "crates/runlark-wasm", version = "0.1.0" }
runlark-cli = { path = "crates/runlark-cli", version = "0.1.0" }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
uuid = { version = "=1.29.3", features = ["v4", "serde"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
tokio = { version = "=1.54.1", features = ["full"] }
axum = "=0.8.9"
tower-http = { version = "=0.7.1", features = ["cors", "trace"] }
clap = { version = "=4.6.9", features = ["derive"] }
tempfile = "=3.27.0"
# reqwest 0.13 defaults to rustls with aws-lc-rs; keep native-tls like tokio-tungstenite.
reqwest = { version = "=0.13.5", default-features = false, features = [
  "charset",
  "http2",
  "json",
  "native-tls",
  "query",
  "system-proxy",
] }
tokio-tungstenite = { version = "=0.30.0", features = ["native-tls"] }
futures-util = "=0.3.34"
sha2 = "=0.11.1"
hex = "=0.4.3"
tokio-postgres = "=0.7.18"
deadpool-postgres = "=0.14.2"
# 48.x is the Wasmtime LTS line; take only its patch releases.
wasmtime = { version = "=48.0.10", default-features = false, features = [
  "cranelift",
  "component-model",
  "runtime",
  "std",
] }
wit-parser = { version = "=0.263.0", default-features = false, features = ["decoding"] }
wit-component = { version = "=0.263.0", default-features = false }
wat = "=1.263.0"
