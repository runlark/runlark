name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On a cache hit neither mise nor the tools come from GitHub's release downloads, which have
      # failed for hours at a time. The action installs only jq; the post step saves the cache with
      # every tool `scripts/setup` installs after it.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: jq
          version: "2026.10.19"
          # The mise binary in that release's signed linux-x64 archive; a version bump changes it.
          sha256: 3162760f40b6b5f706c60641e4ef5ee7322bc6c54f72fc26a7111b337aa18d9d
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          cache_save_post: true
      - name: Set up pinned tools and dependencies
        run: scripts/setup
      - name: Run complete gate and write Sych evidence
        run: mise exec -- scripts/ci-check
      # The account's artifact storage quota is exhausted; a failed upload is missing Sych
      # evidence (reported by Sych as CI_ARTIFACT_MISSING), not a failed gate.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: sych-reports
          path: |
            .reports/outcomes.json
            .reports/sych-ci.json
          if-no-files-found: error
          retention-days: 7
